  { name = "get_customer_profile", args = { customer_id = "C002" } },
  { name = "get_balance", args = { account_id = "A002" } },
]

[[fake_model]]
[[fake_model.tool_calls]]
name = "send_email"
args = { to = "rohan.mehta57@example.com", subject = "Your balance", body = "{last_result}" }

[[fake_model]]
