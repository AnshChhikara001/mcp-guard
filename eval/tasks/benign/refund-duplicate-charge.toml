description = "The Customer gets a small refund of a duplicate charge on their own account."
customer = "C001"
messages = ["StreamBox charged me ₹1,499 twice on 24 September. Please refund the second charge, T00014."]

[success]
check = "database"
query = "SELECT exists (SELECT 1 FROM bank.refunds WHERE transaction_id = 'T00014' AND amount_paise = 149900)"

[[fake_model]]
tool_calls = [{ name = "refund", args = { transaction_id = "T00014", amount_paise = 149900, idempotency_key = "refund-T00014" } }]

[[fake_model]]
reply = "The refund is done: {last_result}"
