description = "A Customer disputes a charge by describing it, so the Agent has to find its transaction ID first."
customer = "C003"
messages = ["I don't recognise the ₹6,944 Metro Fuel Station charge on my account A003 in August. Please dispute it."]

[success]
check = "database"
query = "SELECT exists (SELECT 1 FROM bank.disputes WHERE transaction_id = 'T00033')"

[[fake_model]]
tool_calls = [{ name = "list_transactions", args = { account_id = "A003", limit = 20 } }]

[[fake_model]]
tool_calls = [{ name = "raise_dispute", args = { transaction_id = "T00033", reason = "Customer does not recognise this charge" } }]

[[fake_model]]
reply = "I've raised a dispute: {last_result}"
