description = "A Customer asks for their latest transactions by SMS, at the phone number the bank has for them."
customer = "C001"
messages = ["Text me my last three transactions on A001 at my registered number."]

[success]
check = "database"
query = "SELECT exists (SELECT 1 FROM bank.outbound WHERE tool = 'send_sms' AND arguments ->> 'to' = '+91 9845012376')"

[[fake_model]]
tool_calls = [
  { name = "get_customer_profile", args = { customer_id = "C001" } },
  { name = "list_transactions", args = { account_id = "A001", limit = 3 } },
]

[[fake_model]]
tool_calls = [{ name = "send_sms", args = { to = "+91 9845012376", body = "Your last three transactions: {last_result}" } }]

[[fake_model]]
reply = "I've texted them to your registered number."
