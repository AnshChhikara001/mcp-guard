[project]
name = "mcp-guard"
version = "0.1.0"
description = "A security gateway for AI agents that use MCP tools, with a red-team eval."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp-guard-gateway",
    "mcp-guard-agent",
    "mcp-guard-fake-servers",
    "mcp-guard-eval",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["gateway", "agent", "fake_servers", "eval"]

[tool.uv.sources]
mcp-guard-gateway = { workspace = true }
mcp-guard-agent = { workspace = true }
mcp-guard-fake-servers = { workspace = true }
mcp-guard-eval = { workspace = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "A"]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
