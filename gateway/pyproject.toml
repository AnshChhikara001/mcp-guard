[project]
name = "mcp-guard-gateway"
version = "0.1.0"
description = "The Gateway: an MCP server towards Agents that decides every Tool call."
requires-python = ">=3.13,<3.14"
dependencies = [
    "en-core-web-md==3.8.0",
    "mcp>=2.3.0",
    "presidio-analyzer>=2.2.364",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcp-guard-gateway = "mcp_guard.gateway.server:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_guard.gateway"

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
